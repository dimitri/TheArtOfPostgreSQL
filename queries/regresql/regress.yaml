  # ── 40-listen-notify chapter ─────────────────────────────────────────────
  # The listen/notify pattern requires a live multi-session setup: one session
  # LISTENs, another sends NOTIFYs, and a consumer processes the async payloads.
  # This is exercised by the taop concurrency Common Lisp app (taop retweet),
  # not by a single-connection regression test.  Exclude every SQL file here
  # and test the chapter via the dedicated concurrency test suite instead.
  - 07-concurrency/40-listen-notify/*.sql

