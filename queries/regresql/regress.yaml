pguri: postgres://taop:taop@localhost:5433/taop?sslmode=disable
root: .
exclude:
  # ── Non-deterministic output ──────────────────────────────────────────────

  # `show server_version` returns the exact version string of the running
  # PostgreSQL instance (e.g. "16.3", "17.0") which differs for every matrix
  # leg and every new minor release.  There is no stable expected output.
  - 02-intro/04-postgresql/01.sql

  # pg_database_size() returns different values depending on the PostgreSQL
  # major version (catalog storage layout differs) and the amount of data
  # loaded; there is no stable expected output across matrix legs.
  - 03-writing-sql-queries/07-psql/05_01.sql

  # TABLESAMPLE bernoulli(20) draws a random sample of pg_type rows on every
  # execution; the result set differs between runs and PostgreSQL versions.
  - 05-data-types/23-pg-data-types-101/02.sql

  # EXPLAIN (ANALYZE) output contains actual timing values (actual time=,
  # Planning Time, Execution Time) and buffer hit counts that are inherently
  # machine- and load-dependent; they differ between every run and host.
  - 04-sql-select/15-sql-102/02_02.sql
  - 04-sql-select/15-sql-102/02_03.sql

  # GROUP BY ROLLUP / CUBE / plain GROUP BY without a final ORDER BY:
  # PostgreSQL's hash aggregate produces rows in an undefined order that can
  # vary between executions and major versions even with identical data.
  - 04-sql-select/16-sql-103/04_02.sql
  - 04-sql-select/16-sql-103/04_03.sql
  - 04-sql-select/16-sql-103/06_03.sql
  - 05-data-types/23-pg-data-types-101/02_05.sql

  # Hash join / nested-loop order without ORDER BY: the self-join on
  # tweet.users uses a regex bio match; the planner's chosen strategy
  # (hash join vs. nested loop) varies across PG 14–18, producing rows
  # in different orders.  The query intentionally has no ORDER BY clause.
  - 07-concurrency/36-dml/02_01.sql

  # uuid_generate_v4() generates a fresh random UUID on every call.
  - 05-data-types/23-pg-data-types-101/07_02.sql

  # Contains now() inside DML (INSERT INTO tstz) executed inside a
  # BEGIN/COMMIT block; the stored timestamps change on every run.
  - 05-data-types/23-pg-data-types-101/09_02_tz.sql

  # ── psql date-cast variable interpolation ────────────────────────────────
  # These files use the psql idiom `date :'varname'` or set a variable to a
  # SQL expression such as `date '1978-01-01'`.  psql performs plain text
  # substitution so the result is valid SQL; regresql uses parameterized
  # queries ($N placeholders) where `date $1` is a syntax error and a SQL
  # expression cannot be passed as a typed bind parameter.

  # date :'start' / date :'beginning' / date :'day' pattern
  - 02-intro/02-usecase/04_01.sql
  - 02-intro/02-usecase/07_01.sql
  - 02-intro/02-usecase/08_01.sql
  - 04-sql-select/14-sql-101/04_01.sql
  - 04-sql-select/14-sql-101/04_02.sql
  - 05-data-types/23-pg-data-types-101/11_05.sql
  - 05-data-types/23-pg-data-types-101/11_06.sql

  # \set season 'date ''1978-01-01''' — the value is a SQL expression, not a
  # plain scalar; it cannot be bound as a typed $N parameter.
  - 04-sql-select/14-sql-101/05_01_f1db.notfinishers.sql
  - 04-sql-select/16-sql-103/03_01.sql
  - 04-sql-select/16-sql-103/04_01.sql


  # ── DDL / schema-mutation statements ─────────────────────────────────────
  # These files contain CREATE TABLE, INSERT or other schema-mutating commands
  # that are not idempotent.  Running them as regression tests would fail on
  # the second invocation ("relation already exists") or leave untracked data.
  - 05-data-types/24-non-relational-types/04_01.sql

  # ── PREPARE / EXECUTE statement pair ─────────────────────────────────────
  # $1 inside a PREPARE body is the future prepared statement's own parameter,
  # not an outer query parameter; it cannot be bound via the extended query
  # protocol that regresql uses.  06_02.sql (EXECUTE foo) depends on 06_01.sql
  # having run first, so both are excluded.
  - 02-intro/02-usecase/06_01.sql
  - 02-intro/02-usecase/06_02.sql

  # ── DML without RETURNING ─────────────────────────────────────────────────
  # INSERT / UPDATE / DELETE queries without a RETURNING clause return no
  # rows and modify database state on every invocation, making them
  # unsuitable for idempotent regression testing.
  - 07-concurrency/36-dml/04_01.sql

  # ── 36-dml chapter: DML statements and transaction scripts ────────────────
  # Most files in this chapter contain INSERT / UPDATE / DELETE (no RETURNING)
  # or BEGIN blocks that leave open transactions or run non-idempotent DDL.
  # The SELECT-only queries (02_04, 03_04, 04_02) are kept; 02_01 is
  # excluded above due to non-deterministic join order.

  # INSERT without RETURNING
  - 07-concurrency/36-dml/01_01_dream-theseus.sql
  - 07-concurrency/36-dml/01_02_dream-users.sql
  - 07-concurrency/36-dml/02_02_dream-followers-love.sql
  - 07-concurrency/36-dml/02_03_dream-followers-fairies.sql
  - 07-concurrency/36-dml/05_01.sql

  # UPDATE without RETURNING / BEGIN+UPDATE transaction
  - 07-concurrency/36-dml/03_01_dream-nickname-puck.sql
  - 07-concurrency/36-dml/03_03_dream-nicknames.sql

  # psql output transcript (│ box-drawing characters — not valid SQL)
  - 07-concurrency/36-dml/03_02.sql

  # DELETE in BEGIN/ROLLBACK blocks
  - 07-concurrency/36-dml/05_02.sql
  - 07-concurrency/36-dml/05_03.sql

  # EXPLAIN (ANALYZE) inside BEGIN/ROLLBACK — non-deterministic timing output
