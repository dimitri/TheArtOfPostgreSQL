services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
    image: taop-postgres:${POSTGRES_VERSION:-16}
    # pg_stat_statements must be preloaded at server start; the Query
    # Optimization course relies on it for workload observation labs.
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: taop
      POSTGRES_USER: taop
      POSTGRES_PASSWORD: taop
    ports:
      - "5433:5432"
    volumes:
      # Mount one level above /data so that both PG≤17 (which use
      # /var/lib/postgresql/data) and PG18+ (which use a versioned
      # subdirectory like /var/lib/postgresql/18/main via pg_ctlcluster)
      # can find their data directory inside the same named volume.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taop -d taop"]
      interval: 5s
      timeout: 5s
      retries: 5

  taop:
    build:
      context: .
      dockerfile: docker/taop.Dockerfile
      target: taop
      args:
        HASHTAG_URL: "${HASHTAG_URL:-https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/dashboard_x_usa_x_filter_nativeretweets.csv}"
        HYDRORIVERS_URL: "${HYDRORIVERS_URL:-https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/hydro_eu.zip}"
    environment:
      PGPASSWORD: taop
      PGUSER: taop
      PGDATABASE: taop
      PGHOST: postgres
      PGPORT: 5432
      GEONAMES_DIR: /data/geonames
      NATURALEARTH_DIR: /data/naturalearth
      LASTFM_DIR: /data/lastfm
      SCAN34_DIR: /data/scan34
      MAGIC_DIR: /data/magic
      RATES_DIR: /data/rates
      SHAKESPEARE_DIR: /data/shakespeare
      SHAKESPEARE_PLAY_XML: /data/shakespeare/shakes/dream.xml
      F1DB_DIR: /data/f1db
      MOMA_DIR: /data/MoMA
      OPENDATA_DIR: /data/opendata
      EAV_DIR: /data/eav
      SANDBOX_DIR: /data/sandbox
      COUNTER_DIR: /data/counter
      HASHTAG_DIR: /data/hashtag
      HYDRORIVERS_DIR: /data/hydrorivers
      OSM_LONDON_DIR: /data/osm-london
      NATURAL_EARTH_DIR: /data/natural_earth
      CHINOOK_SQL: /usr/src/taop/cdstore/Chinook_PostgreSql.sql
    volumes:
      - ./queries:/usr/src/taop/queries:ro
      - ./apps/cdstore:/usr/src/taop/cdstore:ro
      - ./tooling:/usr/src/taop/tooling:ro
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /usr/src/taop/queries
    init: true

  commitlog:
    build:
      context: .
      dockerfile: docker/taop.Dockerfile
      target: commitlog
    environment:
      PGPASSWORD: taop
      PGUSER: taop
      PGDATABASE: taop
      PGHOST: postgres
      PGPORT: 5432
      COMMITLOG_DIR: /data/commitlog
    volumes:
      - ./queries:/usr/src/taop/queries:ro
      - ./apps/cdstore:/usr/src/taop/cdstore:ro
      - ./tooling:/usr/src/taop/tooling:ro
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /usr/src/taop/queries
    init: true

  psql:
    build:
      context: .
      dockerfile: docker/psql.Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
    environment:
      PGPASSWORD: taop
      PGUSER: taop
      PGDATABASE: taop
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./queries:/usr/src/taop/queries:ro
      - ./apps/cdstore:/usr/src/taop/cdstore:ro
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["psql"]

  query-ui:
    build:
      context: .
      dockerfile: src/query-ui/Dockerfile
    ports:
      - "8042:8042"
    environment:
      DATABASE_URL: postgresql://taop:taop@postgres:5432/taop
    volumes:
      - ./queries:/queries:ro
      - ./toc.txt:/toc.txt:ro
      - ./query-params.json:/query-params.json:ro
      - ./starter-kit:/starter-kit:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # scratch base image has no shell/wget; the binary probes itself instead
      test: ["CMD", "/query-ui", "-healthcheck", "-port", "8042"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
