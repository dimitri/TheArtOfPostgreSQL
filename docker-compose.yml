services:
  postgres:
    # image + build together: `docker compose up` pulls this tag from ghcr.io
    # (published by .github/workflows/postgres-seeded-prebuild.yml on every
    # push to main that touches data/, tooling/, or this Dockerfile) when no
    # matching image exists locally yet -- no build, no load-data step, just
    # a download. Running `docker compose build postgres` at any point builds
    # from source instead and tags the result with this same name, so it
    # transparently takes over from the pulled image on subsequent `up`s
    # (Compose only pulls when no local image is present under the tag).
    # To go back to the published image: `docker compose pull postgres`.
    image: ghcr.io/dimitri/theartofpostgresql/postgres-seeded:${POSTGRES_VERSION:-16}
    build:
      context: .
      # Bakes every dataset (including commitlog) into the image at build
      # time (see docker/seeded-postgres.Dockerfile) so `docker compose up`
      # needs no separate load-data step. For faster iteration on
      # postgres.Dockerfile itself (no full reseed per change), override:
      #   POSTGRES_DOCKERFILE=docker/postgres.Dockerfile docker compose build
      dockerfile: ${POSTGRES_DOCKERFILE:-docker/seeded-postgres.Dockerfile}
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
        POSTGIS_VERSION: ${POSTGIS_VERSION:-3.4}
        HASHTAG_URL: "${HASHTAG_URL:-https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/dashboard_x_usa_x_filter_nativeretweets.csv}"
        HYDRORIVERS_URL: "${HYDRORIVERS_URL:-https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/hydro_eu.zip}"
    # pg_stat_statements must be preloaded at server start; the Query
    # Optimization course relies on it for workload observation labs.
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: taop
      POSTGRES_USER: taop
      POSTGRES_PASSWORD: taop
    ports:
      - "5433:5432"
    volumes:
      # Mount one level above /data so that both PG≤17 (which use
      # /var/lib/postgresql/data) and PG18+ (which use a versioned
      # subdirectory like /var/lib/postgresql/18/main via pg_ctlcluster)
      # can find their data directory inside the same named volume.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 matters: while the seeded-image entrypoint restores the
      # docker-entrypoint-initdb.d dump on first start, it runs a *temporary*
      # postgres with listen_addresses='' (unix socket only, by design --
      # see docker-library/postgres's docker-entrypoint.sh) before starting
      # the real, network-reachable one. Plain `pg_isready` (no -h) connects
      # over the unix socket and reports healthy against that temporary
      # instance -- query-ui would then race to connect over TCP and fail.
      # Forcing TCP here makes the healthcheck only pass once the real
      # server, the one other containers can actually reach, is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U taop -d taop"]
      interval: 5s
      timeout: 5s
      retries: 5

  query-ui:
    build:
      context: .
      dockerfile: src/query-ui/Dockerfile
    ports:
      - "8042:8042"
    environment:
      DATABASE_URL: postgresql://taop:taop@postgres:5432/taop
    volumes:
      - ./queries:/queries:ro
      - ./toc.txt:/toc.txt:ro
      - ./query-params.json:/query-params.json:ro
      - ./starter-kit:/starter-kit:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # scratch base image has no shell/wget; the binary probes itself instead
      test: ["CMD", "/query-ui", "-healthcheck", "-port", "8042"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
