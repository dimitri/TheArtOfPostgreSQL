name: Devcontainer Prebuild

# Rebuild and push the devcontainer image to ghcr.io whenever anything that
# affects its content changes on main.  The image is referenced by
# .devcontainer/docker-compose.yml so Codespace creation pulls a pre-built
# image instead of compiling the taop binary (SBCL, ~3 min) and cloning the
# commitlog git repos from scratch.
#
# The build reuses the GHA buildx cache written by ci.yml (scope=taop-build).
# If ci.yml ran on the same commit first, SBCL compilation and git clones are
# free cache hits here.

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "docker/taop.Dockerfile"   # base and taop-build stages are shared
      - "tooling/**"               # taop binary source
      - "data/**"                  # datasets baked into the image (incl. commitlog Makefile)
      - "apps/cdstore/Chinook_PostgreSql.sql"
  workflow_dispatch:               # allow manual trigger for the initial push

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  prebuild:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: devcontainer
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/theartofpostgresql/devcontainer:main
            ghcr.io/${{ github.repository_owner }}/theartofpostgresql/devcontainer:latest
          # Share the taop-build cache scope with ci.yml.
          # Stages 1 (base) and 2 (taop-build) are byte-for-byte identical across
          # both Dockerfiles, so the layers are shared automatically by buildx.
          # Stage 2b (commitlog-data) is also cached here.
          cache-from: type=gha,scope=taop-build
          cache-to: type=gha,scope=taop-build,mode=max
