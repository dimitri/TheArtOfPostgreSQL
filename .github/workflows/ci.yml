name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-checks:
    name: Query content checks
    # Self-hosted, off ubuntu-latest, to run CI without GitHub-hosted
    # runner minutes/billing. Needs a runner registered against this repo
    # specifically under these labels -- self-hosted runners on a personal
    # GitHub account are scoped per-repository, not shared across repos.
    runs-on: [self-hosted, scaleway-fr-par]
    # This repo is public and triggers on pull_request -- without this
    # gate, anyone could open a PR from a fork and have their workflow
    # code execute on this runner (a real, well-documented risk of
    # self-hosted runners on public repos, not a hypothetical one). true
    # for push (no pull_request context to check) and for PRs whose head
    # is a branch of this repo itself; false for a PR opened from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Static checks against queries/*.sql — no database needed, so this
      # runs standalone rather than gating on the PG matrix below. Guards
      # against regressions like the old camelCase Chinook column names or
      # a \set dependency that only worked because of book's continuous
      # psql session, both found and fixed by hand once already (see
      # tooling/checks/*.sh for the full story on each).
      - name: Run content checks
        run: ./tooling/checks/run-all.sh

  test:
    name: PG ${{ matrix.pg }}
    # Self-hosted (see content-checks above). A single self-hosted runner
    # only ever picks up one job at a time -- unlike GitHub-hosted runners,
    # which give each matrix leg its own VM automatically. Six runner
    # instances are registered under these same labels specifically so
    # this 6-leg matrix can still run fully in parallel. Also: the
    # postgres/query-ui containers this job starts publish ports on the
    # runner's own host network (not an
    # isolated per-job network like GitHub-hosted runners provide) -- see
    # docker-compose.yml's port bindings (127.0.0.1-only) for why that
    # matters on a shared, persistent host.
    runs-on: [self-hosted, scaleway-fr-par]
    # Same fork-PR gate as content-checks above -- see its comment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # 19beta3 is pre-release: PGDG/upstream churn is expected until GA.
    continue-on-error: ${{ matrix.pg == '19beta3' }}
    strategy:
      matrix:
        # pg_major is the bare major version PGDG's apt packages use
        # (postgresql-$pg_major) -- equal to pg once a version is GA, but
        # distinct while pg is still a pre-release tag like "19beta3" (whose
        # image tag is postgres:19beta3-bookworm, not postgres:19-bookworm).
        # See docker/postgres.Dockerfile for the full explanation.
        include:
          - { pg: "14",      pg_major: "14" }
          - { pg: "15",      pg_major: "15" }
          - { pg: "16",      pg_major: "16" }
          - { pg: "17",      pg_major: "17" }
          - { pg: "18",      pg_major: "18" }
          - { pg: "19beta3", pg_major: "19" }
      fail-fast: false

    env:
      POSTGRES_VERSION: ${{ matrix.pg }}
      PG_MAJOR: ${{ matrix.pg_major }}
      # constant project name → docker compose looks for image taop-taop:latest
      COMPOSE_PROJECT_NAME: taop
      # docker-compose.yml defaults to the pre-seeded image (bakes in a full
      # load-data run at build time) — not worth paying that 5x across this
      # PG-version matrix when this job loads data itself via the taop
      # service below. Use the on-demand-load image instead.
      POSTGRES_DOCKERFILE: docker/postgres.Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The taop binary is PG-version-agnostic; all matrix legs share one cache.
      # The first leg to run writes the cache; the others read it.
      - name: Build taop image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/taop.Dockerfile
          target: taop
          load: true
          tags: taop-taop:latest
          build-args: |
            HASHTAG_URL=https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/dashboard_x_usa_x_filter_nativeretweets.csv
            HYDRORIVERS_URL=https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/hydro_eu.zip
          cache-from: type=gha,scope=taop-build
          cache-to: type=gha,scope=taop-build,mode=max

      # --build forces a local build from POSTGRES_DOCKERFILE above rather
      # than pulling docker-compose.yml's image: tag -- ghcr.io/.../
      # postgres-seeded now has a real image published for every PG version
      # in this matrix (see postgres-seeded-prebuild.yml), which would
      # otherwise get pulled instead and break the load-data step below (its
      # schemas already exist in that image, and it's not the on-demand-load
      # Dockerfile this job means to test).
      - name: Start PostgreSQL ${{ matrix.pg }}
        run: docker compose up -d --build postgres

      # load-data iterates *commands* and chinook is not in *commands-to-skip*,
      # so it is included automatically — no separate chinook step needed.
      # taop lives in docker/docker-compose.tools.yml (on-demand services,
      # not part of the default docker-compose.yml) — combine both files.
      - name: Load all datasets
        run: docker compose -f docker-compose.yml -f docker/docker-compose.tools.yml run --rm taop load-data

      # Set search_path for taop (book queries) and create cdstore user (cdstore app queries).
      # taop needs f1db + chinook + scan34 schemas resolvable without schema qualification.
      # scan34 is the access_log schema used in chapter 23 (IP address type examples).
      - name: Set up database roles and search paths
        run: |
          docker compose -f docker-compose.yml -f docker/docker-compose.tools.yml run --rm --entrypoint psql taop \
            -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE taop SET search_path TO f1db, chinook, public, scan34;" \
            -c "CREATE USER cdstore WITH PASSWORD 'cdstore';" \
            -c "GRANT USAGE ON SCHEMA chinook TO cdstore;" \
            -c "ALTER ROLE cdstore SET search_path TO chinook;" \
            -c "GRANT SELECT ON ALL TABLES IN SCHEMA chinook TO cdstore;"

      - name: Install regresql
        run: |
          go install github.com/dimitri/regresql@latest
          sudo install -m 755 "$(go env GOPATH)/bin/regresql" /usr/local/bin/regresql

      # postgres is exposed on localhost:5433 (see docker-compose.yml ports).
      - name: Run cdstore regression tests
        working-directory: apps/cdstore
        run: regresql test

      # A few book queries have output that is genuinely tied to the server's
      # major version -- 05-data-types/23-pg-data-types-101/01.sql lists the
      # pg_catalog types, and every major adds some (PG 19 adds oid8).  regresql
      # only ever compares against one expected/<path>.out, so for those queries
      # we commit a .pgNN.out variant next to the baseline and swap it in here.
      # Queries that are non-deterministic by nature are excluded outright in
      # queries/regresql/regress.yaml instead.
      - name: Select version-specific expected files
        run: ./tooling/regresql/use-version-expected.sh

      - name: Run book query regression tests
        working-directory: queries
        run: regresql test

      - name: Capture postgres logs on failure
        if: failure()
        run: docker logs taop-postgres-1 2>&1 || true

      - name: Tear down
        if: always()
        run: docker compose down -v
