# Optional, on-demand services: not needed for the default `docker compose
# up` flow (postgres already ships pre-seeded, see docker-compose.yml and
# docker/seeded-postgres.Dockerfile), only for interactive psql access or for
# iterating on data loading itself. Combine with the base file explicitly:
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.tools.yml run --rm -it psql
#
services:
  # Loads datasets one-by-one against a running postgres — this is what
  # seeded-postgres.Dockerfile itself runs at build time. Mainly useful
  # paired with the fast-iteration escape hatch (see docker-compose.yml):
  #   POSTGRES_DOCKERFILE=docker/postgres.Dockerfile docker compose build postgres
  #   docker compose -f docker-compose.yml -f docker/docker-compose.tools.yml run --rm taop load-data
  taop:
    build:
      context: .
      dockerfile: docker/taop.Dockerfile
      target: taop
      args:
        HASHTAG_URL: "${HASHTAG_URL:-https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/dashboard_x_usa_x_filter_nativeretweets.csv}"
        HYDRORIVERS_URL: "${HYDRORIVERS_URL:-https://storage.sbg.cloud.ovh.net/v1/AUTH_e5524010dbdf45ccb5cdac68b254c4f7/TAOP/hydro_eu.zip}"
    environment:
      PGPASSWORD: taop
      PGUSER: taop
      PGDATABASE: taop
      PGHOST: postgres
      PGPORT: 5432
      GEONAMES_DIR: /data/geonames
      NATURALEARTH_DIR: /data/naturalearth
      LASTFM_DIR: /data/lastfm
      SCAN34_DIR: /data/scan34
      MAGIC_DIR: /data/magic
      RATES_DIR: /data/rates
      SHAKESPEARE_DIR: /data/shakespeare
      SHAKESPEARE_PLAY_XML: /data/shakespeare/shakes/dream.xml
      F1DB_DIR: /data/f1db
      MOMA_DIR: /data/MoMA
      OPENDATA_DIR: /data/opendata
      EAV_DIR: /data/eav
      SANDBOX_DIR: /data/sandbox
      COUNTER_DIR: /data/counter
      HASHTAG_DIR: /data/hashtag
      HYDRORIVERS_DIR: /data/hydrorivers
      OSM_LONDON_DIR: /data/osm-london
      NATURAL_EARTH_DIR: /data/natural_earth
      CHINOOK_SQL: /usr/src/taop/cdstore/Chinook_PostgreSql.sql
    volumes:
      - ./queries:/usr/src/taop/queries:ro
      - ./apps/cdstore:/usr/src/taop/cdstore:ro
      - ./tooling:/usr/src/taop/tooling:ro
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /usr/src/taop/queries
    init: true

  # commitlog data (git histories of postgres/pgloader) already ships baked
  # into the seed by default; this service is only for refreshing it with
  # commits made since the image was built.
  commitlog:
    build:
      context: .
      dockerfile: docker/taop.Dockerfile
      target: commitlog
    environment:
      PGPASSWORD: taop
      PGUSER: taop
      PGDATABASE: taop
      PGHOST: postgres
      PGPORT: 5432
      COMMITLOG_DIR: /data/commitlog
    volumes:
      - ./queries:/usr/src/taop/queries:ro
      - ./apps/cdstore:/usr/src/taop/cdstore:ro
      - ./tooling:/usr/src/taop/tooling:ro
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /usr/src/taop/queries
    init: true

  psql:
    build:
      context: .
      dockerfile: docker/psql.Dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-16}
    environment:
      PGPASSWORD: taop
      PGUSER: taop
      PGDATABASE: taop
      PGHOST: postgres
      PGPORT: 5432
    volumes:
      - ./queries:/usr/src/taop/queries:ro
      - ./apps/cdstore:/usr/src/taop/cdstore:ro
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["psql"]
