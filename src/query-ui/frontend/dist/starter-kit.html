<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Kit - The Art of PostgreSQL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #3498db;
      --dark: #2c3e50;
      --light: #ecf0f1;
      --border: #bdc3c7;
      --success: #27ae60;
      --warning: #e74c3c;
      --code-bg: #282c34;
      --code-fg: #abb2bf;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Shared app switcher — identical markup/styling to index.html, so
       "Book Queries" and "Starter Kit" read as two views of one app. */
    .app-nav {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      background: #1a252f;
    }

    .app-nav-item {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .app-nav-item:hover {
      color: white;
      background: rgba(255,255,255,0.08);
    }

    .app-nav-item.active {
      color: white;
      background: var(--primary);
    }

    /* Inline Font Awesome icons ride the text baseline next to their label;
       more specific rules (.page-card .icon) resize and recolour them. */
    .icon {
      width: 1em;
      height: 1em;
      fill: currentColor;
      vertical-align: -0.125em;
      flex-shrink: 0;
    }

    .app-nav-item .icon,
    .app-nav-cta .icon {
      margin-right: 6px;
    }

    /* The one commercial CTA in the app, parked on the nav bar's otherwise
       empty right half. Deliberately not a filled button: it is on screen
       for the whole session, so it has to stay legible without ever
       competing with Run or with the active-view tab. Warm amber reads as
       "offer" against the slate bar and the blue active tab without
       shouting. */
    .app-nav-cta {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      color: #e8b563;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid rgba(232,181,99,0.35);
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .app-nav-cta:hover {
      color: #1a252f;
      background: #e8b563;
      border-color: #e8b563;
    }

    .app-nav-cta:focus-visible {
      outline: 2px solid #e8b563;
      outline-offset: 2px;
    }

    /* Menu: the six starter-kit pages, styled after
       oss.theartofpostgresql.com/projects/ — a dark hero band in the same
       plum/lavender palette (deep #372649, muted #67527a, sky #60b2d3),
       Bookman serif headings over Lato body text, and a project-card grid. */
    .menu-hero {
      background: #372649;
      padding: 64px 20px 56px;
      text-align: center;
    }

    .menu-hero h1 {
      font: 500 2.6rem/1.25 'Bookman', 'Bookman Old Style', Georgia, serif;
      color: #fff;
      margin-bottom: 12px;
    }

    .menu-hero .subtitle {
      font: 300 1.15rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #b8a9c9;
      max-width: 620px;
      margin: 0 auto;
    }

    .menu {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 20px 60px;
    }

    .page-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    /* Closing block at the foot of an individual lab. A reader who got here
       finished the whole page, so this is the one moment the lab has earned
       an ask -- kept to a rule, a line of prose and two links, well below
       the last query rather than floating over it. */
    .lab-footer {
      margin: 44px 0 8px;
      padding-top: 24px;
      border-top: 1px solid #e5e3e7;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 18px;
      font-size: 0.92rem;
      color: #67527a;
    }

    .lab-footer a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #372649;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(55,38,73,0.3);
    }

    .lab-footer a:hover {
      color: #60b2d3;
      border-bottom-color: #60b2d3;
    }

    .lab-footer .next { margin-left: auto; }

    .page-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: white;
      border: 1px solid #e5e3e7;
      border-radius: 8px;
      padding: 28px 26px;
      transition: all 0.15s;
    }

    .page-card:hover {
      border-color: #60b2d3;
      box-shadow: 0 6px 20px rgba(55,38,73,0.1);
      transform: translateY(-2px);
    }

    /* The seventh card closes the funnel rather than continuing it, so it
       reads as an endpoint: the hero's plum instead of white, no STEP
       number, and it leaves the app. Sitting in the same grid keeps it an
       answer to "what now?" rather than an ad bolted onto the page. */
    .page-card.finish {
      background: linear-gradient(160deg, #372649, #4a3768);
      border-color: #372649;
      color: #f2eef7;
    }

    .page-card.finish:hover {
      border-color: #e8b563;
      box-shadow: 0 6px 20px rgba(55,38,73,0.25);
    }

    .page-card.finish .icon { fill: #e8b563; }
    .page-card.finish:hover .icon { fill: #e8b563; }
    .page-card.finish .num { color: #b9a7cd; }
    .page-card.finish .blurb { color: #d7cce4; }
    .page-card.finish .start { color: #e8b563; }

    .page-card .icon {
      width: 30px;
      height: 30px;
      fill: #67527a;
      margin-bottom: 14px;
      display: block;
    }

    .page-card:hover .icon {
      fill: #60b2d3;
    }

    .page-card .num {
      font: 700 0.75rem 'Lato', sans-serif;
      letter-spacing: 1px;
      color: #60b2d3;
      margin-bottom: 6px;
    }

    .page-card .title {
      font: 500 1.25rem 'Bookman', 'Bookman Old Style', Georgia, serif;
      color: #372649;
      margin-bottom: 8px;
    }

    .page-card .blurb {
      font: 400 0.92rem/1.55 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #67527a;
      flex: 1;
    }

    .page-card .start {
      font: 700 0.8rem 'Lato', sans-serif;
      color: #67527a;
      margin-top: 18px;
    }

    .page-card:hover .start {
      color: #60b2d3;
    }

    /* Notebook: a single centered column of cells, like Jupyter */
    .notebook {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    .notebook-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .back-to-menu {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .back-to-menu:hover {
      text-decoration: underline;
    }

    .markdown-cell { padding: 4px 0; }
    .markdown-cell h1 { font-size: 1.6rem; margin: 24px 0 12px; color: var(--dark); }
    .markdown-cell h2 { font-size: 1.3rem; margin: 22px 0 10px; color: var(--dark); }
    .markdown-cell h3 { font-size: 1.1rem; margin: 18px 0 8px; color: var(--dark); }
    .markdown-cell h4 { font-size: 1rem; margin: 16px 0 6px; color: var(--dark); }
    .markdown-cell p { margin-bottom: 12px; }
    .markdown-cell code {
      background: var(--light);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 0.9em;
    }
    .markdown-cell a { color: var(--primary); }
    .markdown-cell ul { margin: 0 0 12px 22px; }
    .markdown-cell blockquote {
      margin: 0 0 12px;
      padding: 4px 14px;
      border-left: 3px solid var(--primary);
      color: #555;
    }
    .markdown-cell blockquote p { margin-bottom: 0; }
    .markdown-cell img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin: 8px 0;
    }
    .markdown-cell .md-code-block {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 0.82rem;
      margin-bottom: 12px;
      white-space: pre;
    }

    /* SQL cell: Jupyter-style — [In] gutter, editable code, Run button,
       output appears directly below the same cell (not a shared results
       pane elsewhere on the page). */
    .sql-cell {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    .cell-gutter {
      flex: 0 0 50px;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 0.75rem;
      color: #7f8c8d;
      text-align: right;
      padding-top: 10px;
    }

    .cell-body {
      flex: 1;
      min-width: 0;
    }

    .cell-input-wrapper {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--code-bg);
    }

    .cell-textarea {
      display: block;
      width: 100%;
      min-height: 60px;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--code-fg);
      font-family: "Monaco", "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: vertical;
    }

    .cell-textarea:focus {
      outline: none;
    }

    .cell-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .cell-run-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .cell-run-btn:hover {
      background: #2980b9;
    }

    .cell-run-btn:disabled {
      background: #95a5a6;
      cursor: default;
    }

    .cell-status {
      font-size: 0.8rem;
      color: #7f8c8d;
    }

    .cell-output {
      margin-top: 8px;
      display: none;
    }

    .cell-output.show {
      display: block;
    }

    .cell-output-error {
      padding: 10px 12px;
      background: #fee;
      border-left: 3px solid var(--warning);
      color: var(--warning);
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      border-radius: 4px;
    }

    .cell-output-table-wrap {
      max-height: 300px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    table.cell-output-table {
      width: 100%;
      border-collapse: collapse;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 0.8rem;
    }

    table.cell-output-table th {
      background: var(--light);
      padding: 6px 10px;
      text-align: left;
      position: sticky;
      top: 0;
    }

    table.cell-output-table td {
      padding: 5px 10px;
      border-top: 1px solid #f0f0f0;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .null { color: #95a5a6; font-style: italic; }

    /* Map/Table tabs: shown only when a cell's result is a single raw-SVG
       value (e.g. built with PostGIS's ST_AsSVG) rather than a row set. */
    .cell-output-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }

    .cell-tab-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
    }

    .cell-tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .cell-output-svg {
      background: var(--code-bg);
      border-radius: 6px;
      padding: 10px;
    }

    .cell-output-svg svg {
      width: 100%;
      height: auto;
      max-height: 480px;
      display: block;
    }

    .loading-notebook {
      text-align: center;
      padding: 60px 20px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <!-- Shared with index.html: Font Awesome path data, faIcon/hydrateIcons,
       and the UTM-tagged link helper. Must load before any markup below
       that carries data-icon or any script that calls faIcon(). -->
  <script src="icons.js"></script>
  <div class="app-nav">
    <a href="/starter-kit.html" class="app-nav-item active" data-icon="flask">Starter Kit</a>
    <a href="/" class="app-nav-item" data-icon="book-open">Book Queries</a>
    <a class="app-nav-cta" id="nav-cta" data-icon="graduation-cap"
       target="_blank" rel="noopener">Get the full course</a>
  </div>
  <script>
    document.getElementById('nav-cta').href = taopURL('/course/', 'nav-starter-kit');
    hydrateIcons();
  </script>

  <div id="app"><div class="loading-notebook">Loading…</div></div>

  <script>
    let pages = [];

    // No server-side routing needed for a 2-view single-page app: the menu
    // is shown when the hash is empty, a page's notebook when it names a
    // slug — plain hash-based client routing keeps this a single static
    // asset like index.html, with no extra chi route per page.
    async function init() {
      try {
        const res = await fetch('/api/starter-kit');
        const data = await res.json();
        pages = data.pages || [];

        window.addEventListener('hashchange', render);
        render();
      } catch (err) {
        document.getElementById('app').innerHTML =
          `<div class="menu"><div class="cell-output-error">Failed to load starter kit: ${escapeHtml(err.message)}</div></div>`;
      }
    }

    function render() {
      const slug = window.location.hash.replace(/^#/, '');
      if (slug) {
        renderPage(slug);
      } else {
        renderMenu();
      }
    }

    // One-line pitch per page, matching the root README's "What you'll
    // learn" list — curated copy, not auto-extracted from the page body, so
    // it stays short and consistent even as the pages themselves evolve.

    const PAGE_BLURBS = {
      '01-nested-lateral': { icon: 'bullseye', blurb: 'Solve top-N per group problems cleanly with a LATERAL join.' },
      '02-grouping-sets':  { icon: 'chart-column', blurb: 'Compute multiple aggregations in a single query with GROUPING SETS + FILTER.' },
      '03-percentiles':    { icon: 'arrow-trend-up', blurb: 'Calculate multiple percentiles efficiently with percentile_cont().' },
      '04-knn-search':     { icon: 'location-dot', blurb: 'Find the closest rows with the <-> operator and a GiST index.' },
      '05-map-as-text':    { icon: 'map', blurb: 'Render a density map as text — no graphics library required.' },
      '06-recursive-rivers': { icon: 'water', blurb: 'Walk a river network, or any tree, by following a parent reference.' },
    };

    function renderMenu() {
      const app = document.getElementById('app');
      const cards = pages.map((p, i) => {
        const meta = PAGE_BLURBS[p.slug] || { icon: 'map', blurb: '' };
        return `
        <a class="page-card" href="#${encodeURIComponent(p.slug)}">
          ${faIcon(meta.icon)}
          <span class="num">STEP ${String(i + 1).padStart(2, '0')}</span>
          <div class="title">${escapeHtml(p.title)}</div>
          <p class="blurb">${escapeHtml(meta.blurb)}</p>
          <span class="start">Start this lab &rarr;</span>
        </a>
      `;
      }).join('');

      const finish = `
        <a class="page-card finish" href="${taopURL('/course/', 'starter-kit-finish')}"
           target="_blank" rel="noopener">
          ${faIcon('graduation-cap')}
          <span class="num">AFTER THE SIX</span>
          <div class="title">Go deeper than the starter kit</div>
          <p class="blurb">These six are the appetiser. The full course covers window
             functions, aggregation, schema design, advanced joins, query optimization
             and reading query plans — across 6 courses and 3 tiers, with the book
             included in every one.</p>
          <span class="start">See the course &rarr;</span>
        </a>
      `;

      app.innerHTML = `
        <div class="menu-hero">
          <h1>PostgreSQL Starter Kit</h1>
          <p class="subtitle">Six hand-picked queries that demonstrate PostgreSQL features that
             are not widely known despite being very useful — run each one directly against
             the lab database as you read.</p>
        </div>
        <div class="menu">
          <div class="page-list">${cards}${finish}</div>
        </div>
      `;
    }

    async function renderPage(slug) {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading-notebook">Loading…</div>';

      try {
        const res = await fetch(`/api/starter-kit/${encodeURIComponent(slug)}`);
        if (!res.ok) {
          const text = await res.text();
          app.innerHTML = `<div class="notebook"><div class="cell-output-error">${escapeHtml(text)}</div></div>`;
          return;
        }
        const page = await res.json();

        const notebook = document.createElement('div');
        notebook.className = 'notebook';

        const header = document.createElement('div');
        header.className = 'notebook-header';
        header.innerHTML = `<a class="back-to-menu" href="#">← All pages</a>`;
        notebook.appendChild(header);

        let sqlCellCount = 0;
        (page.cells || []).forEach(cell => {
          if (cell.type === 'markdown') {
            const div = document.createElement('div');
            div.className = 'markdown-cell';
            div.innerHTML = cell.html;
            notebook.appendChild(div);
          } else if (cell.type === 'sql') {
            sqlCellCount++;
            notebook.appendChild(renderSQLCell(cell.sql, sqlCellCount));
          }
        });

        notebook.appendChild(labFooter(slug));

        app.innerHTML = '';
        app.appendChild(notebook);
      } catch (err) {
        app.innerHTML = `<div class="notebook"><div class="cell-output-error">${escapeHtml(err.message)}</div></div>`;
      }
    }

    // Closing CTA for one lab page. The "next lab" link matters as much as
    // the course link: finishing a page with nowhere to go is what made the
    // six-lab sequence dead-end, and someone who wants lab 04 next is not
    // the person to push a course at.
    function labFooter(slug) {
      const i = pages.findIndex(p => p.slug === slug);
      const next = i >= 0 && i + 1 < pages.length ? pages[i + 1] : null;

      const div = document.createElement('div');
      div.className = 'lab-footer';
      div.innerHTML = `
        <span>Every query here is drawn from
          <a href="${taopURL('/book/contents/', 'lab-' + slug)}"
             target="_blank" rel="noopener">The Art of PostgreSQL${faIcon('up-right-from-square')}</a>,
          and goes further in
          <a href="${taopURL('/course/', 'lab-' + slug)}"
             target="_blank" rel="noopener">the course${faIcon('graduation-cap')}</a>.
        </span>
        ${next
          ? `<a class="next" href="#${encodeURIComponent(next.slug)}">Next: ${escapeHtml(next.title)}${faIcon('arrow-right')}</a>`
          : `<a class="next" href="#">Back to all labs${faIcon('arrow-right')}</a>`}
      `;
      return div;
    }

    // Each SQL cell is fully self-contained: its own textarea, Run button,
    // and output area right below it — Jupyter's model of "this cell's
    // result belongs to this cell", not a single shared results pane like
    // the main Book Queries page uses.
    function renderSQLCell(sql, index) {
      const row = document.createElement('div');
      row.className = 'sql-cell';

      const gutter = document.createElement('div');
      gutter.className = 'cell-gutter';
      gutter.textContent = `In [${index}]:`;
      row.appendChild(gutter);

      const body = document.createElement('div');
      body.className = 'cell-body';

      const wrapper = document.createElement('div');
      wrapper.className = 'cell-input-wrapper';
      const textarea = document.createElement('textarea');
      textarea.className = 'cell-textarea';
      textarea.value = sql;
      textarea.spellcheck = false;
      textarea.rows = Math.min(14, Math.max(2, sql.split('\n').length));
      wrapper.appendChild(textarea);
      body.appendChild(wrapper);

      const actions = document.createElement('div');
      actions.className = 'cell-actions';
      const runBtn = document.createElement('button');
      runBtn.className = 'cell-run-btn';
      runBtn.innerHTML = faIcon('play') + ' Run';
      const status = document.createElement('span');
      status.className = 'cell-status';
      actions.appendChild(runBtn);
      actions.appendChild(status);
      body.appendChild(actions);

      const output = document.createElement('div');
      output.className = 'cell-output';
      body.appendChild(output);

      runBtn.addEventListener('click', () => runCell(textarea, runBtn, status, output));
      textarea.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') runCell(textarea, runBtn, status, output);
      });

      // Delegated once per cell (not re-attached per run) so it keeps working
      // across re-renders of `output` on repeated Run clicks.
      output.addEventListener('click', e => {
        const btn = e.target.closest('.cell-tab-btn');
        if (!btn) return;
        const tab = btn.dataset.tab;
        output.querySelectorAll('.cell-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        output.querySelectorAll('.cell-tab-content').forEach(c => {
          c.style.display = c.dataset.tab === tab ? '' : 'none';
        });
      });

      row.appendChild(body);
      return row;
    }

    async function runCell(textarea, runBtn, status, output) {
      const sql = textarea.value.trim();
      if (!sql) return;

      runBtn.disabled = true;
      status.textContent = 'Running…';
      output.classList.remove('show');

      try {
        const res = await fetch('/api/query/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sql })
        });
        const result = await res.json();

        if (result.error) {
          output.innerHTML = `<div class="cell-output-error">${escapeHtml(result.error)}</div>`;
          status.textContent = '';
        } else {
          output.innerHTML = renderCellResult(result);
          status.textContent = `${result.row_count} row(s), ${result.timing_ms.toFixed(2)}ms`;
        }
        output.classList.add('show');
      } catch (err) {
        output.innerHTML = `<div class="cell-output-error">${escapeHtml(err.message)}</div>`;
        output.classList.add('show');
        status.textContent = '';
      } finally {
        runBtn.disabled = false;
      }
    }

    function renderCellResult(result) {
      if (result.command_tag && (!result.rows || result.rows.length === 0)) {
        return `<p><strong>${escapeHtml(result.command_tag)}</strong></p>`;
      }
      if (!result.rows || result.rows.length === 0) {
        return '<p>No rows returned.</p>';
      }

      const tableHTML = renderTable(result);
      const svg = extractSVG(result);
      if (!svg) return tableHTML;

      // A query built to hand back one finished `<svg>...</svg>` string (the
      // starter kit's PostGIS -> SVG examples) gets a Map tab in front of the
      // raw single-cell table, rather than a wall of path-data text.
      return `
        <div class="cell-output-tabs">
          <button class="cell-tab-btn active" data-tab="map">Map</button>
          <button class="cell-tab-btn" data-tab="table">Table</button>
        </div>
        <div class="cell-tab-content" data-tab="map">${svg}</div>
        <div class="cell-tab-content" data-tab="table" style="display:none">${tableHTML}</div>
      `;
    }

    function renderTable(result) {
      let html = '<div class="cell-output-table-wrap"><table class="cell-output-table"><thead><tr>';
      result.columns.forEach(col => { html += `<th>${escapeHtml(col)}</th>`; });
      html += '</tr></thead><tbody>';

      result.rows.forEach(row => {
        html += '<tr>';
        result.columns.forEach(col => {
          const value = row[col];
          const display = value === null || value === undefined
            ? '<span class="null">NULL</span>'
            : escapeHtml(typeof value === 'object' ? JSON.stringify(value) : String(value));
          html += `<td>${display}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      return html;
    }

    // Detects the starter kit's "one row, one column, raw <svg> markup"
    // convention (the natural output of a query ending in a PostGIS
    // ST_AsSVG(...) string-build) so it can get the Map tab treatment
    // instead of being shown as an unreadable single table cell.
    function extractSVG(result) {
      if (result.columns.length !== 1 || result.rows.length !== 1) return null;
      const value = result.rows[0][result.columns[0]];
      if (typeof value !== 'string') return null;
      const trimmed = value.trim();
      if (!trimmed.startsWith('<svg')) return null;
      return `<div class="cell-output-svg">${ensureSvgDimensions(trimmed)}</div>`;
    }

    // A bare `<svg viewBox="...">` with no width/height attributes has no
    // intrinsic size of its own, only an aspect ratio — and CSS `height:
    // auto` on a sized-by-percentage-width replaced element isn't reliably
    // derived from that aspect ratio across browsers (some fall back to the
    // SVG spec's 300x150 default, rendering a tall, mostly-empty box). Query
    // results here never set width/height on the SVG they build, so add
    // them explicitly from the viewBox before the browser ever lays it out.
    function ensureSvgDimensions(svgMarkup) {
      if (/<svg[^>]*\swidth=/.test(svgMarkup)) return svgMarkup;
      const m = svgMarkup.match(/viewBox="\s*[-\d.eE]+\s+[-\d.eE]+\s+([\d.eE]+)\s+([\d.eE]+)\s*"/);
      if (!m) return svgMarkup;
      const w = parseFloat(m[1]), h = parseFloat(m[2]);
      if (!(w > 0) || !(h > 0)) return svgMarkup;
      // The viewBox on a PostGIS-built map is in degrees (e.g. 0.009 wide),
      // and some browsers treat sub-1 width/height attributes as too small
      // to establish a usable intrinsic size — renderGeoJSONMap works around
      // the same problem by hardcoding pixel-scale 260x180. Do the same
      // here: normalize to a reasonable pixel-scale size, same aspect ratio.
      const scale = 800 / Math.max(w, h);
      const pxW = Math.round(w * scale), pxH = Math.round(h * scale);
      return svgMarkup.replace('<svg ', `<svg width="${pxW}" height="${pxH}" `);
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    init();
  </script>
</body>
</html>
